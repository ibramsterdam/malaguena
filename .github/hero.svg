<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Someone on a couch playing guitar, a warm coffee on the side table, a cat napping on the other cushion">
  <style>
    .steam { stroke: #A6907B; stroke-width: 3; stroke-linecap: round; fill: none; opacity: 0; animation: steam 3.2s ease-in-out infinite; }
    .steam.s2 { animation-delay: 1.1s; }
    .steam.s3 { animation-delay: 2.2s; }
    @keyframes steam {
      0%   { opacity: 0; transform: translateY(6px); }
      25%  { opacity: 0.55; }
      70%  { opacity: 0.15; }
      100% { opacity: 0; transform: translateY(-26px); }
    }

    .strum { transform-box: fill-box; transform-origin: 12% 20%; animation: strum 0.62s ease-in-out infinite alternate; }
    @keyframes strum {
      from { transform: rotate(-6deg); }
      to   { transform: rotate(7deg); }
    }

    .nod { transform-box: fill-box; transform-origin: 50% 90%; animation: nod 2.48s ease-in-out infinite; }
    @keyframes nod {
      0%, 100% { transform: rotate(-1.6deg); }
      50%      { transform: rotate(1.8deg); }
    }

    .toe { transform-box: fill-box; transform-origin: 20% 80%; animation: toe 1.24s ease-in-out infinite alternate; }
    @keyframes toe {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-7deg); }
    }

    .breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.8s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { transform: scale(1, 1); }
      45%      { transform: scale(1.015, 1.05); }
    }

    .tail { transform-box: fill-box; transform-origin: 8% 30%; animation: tail 6.5s ease-in-out infinite; }
    @keyframes tail {
      0%, 78%, 100% { transform: rotate(0deg); }
      84%           { transform: rotate(9deg); }
      90%           { transform: rotate(-4deg); }
    }

    .note { fill: #E0A458; opacity: 0; animation: drift 4.2s ease-out infinite; }
    .note.n2 { animation-delay: 1.4s; }
    .note.n3 { animation-delay: 2.8s; }
    @keyframes drift {
      0%   { opacity: 0; transform: translate(0, 0) rotate(0deg); }
      12%  { opacity: 0.85; }
      70%  { opacity: 0.25; }
      100% { opacity: 0; transform: translate(34px, -88px) rotate(14deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .steam, .strum, .nod, .toe, .breathe, .tail, .note { animation: none; }
      .steam { opacity: 0.35; }
      .note { opacity: 0.5; }
    }
  </style>

  <!-- room -->
  <rect width="960" height="480" fill="#1D1410"/>
  <rect y="408" width="960" height="72" fill="#17100C"/>
  <ellipse cx="470" cy="428" rx="330" ry="16" fill="#241A12"/>

  <!-- side table with coffee -->
  <g>
    <rect x="96" y="322" width="10" height="86" rx="3" fill="#4E3624"/>
    <rect x="44" y="312" width="116" height="12" rx="6" fill="#5A3A22"/>
    <!-- mug -->
    <rect x="78" y="278" width="40" height="34" rx="5" fill="#E0A458"/>
    <rect x="82" y="282" width="32" height="6" rx="3" fill="#4E3624"/>
    <path d="M118 286 q16 4 0 18" stroke="#E0A458" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- steam -->
    <path class="steam" d="M88 268 q-5 -9 1 -17 q5 -7 0 -14"/>
    <path class="steam s2" d="M99 266 q6 -9 0 -17 q-5 -8 1 -15"/>
    <path class="steam s3" d="M109 268 q-4 -8 1 -15 q5 -8 0 -15"/>
  </g>

  <!-- couch -->
  <g>
    <rect x="200" y="196" width="560" height="150" rx="22" fill="#2A1E16" stroke="#3B2C20" stroke-width="3"/>
    <rect x="180" y="252" width="64" height="140" rx="24" fill="#33241A" stroke="#3B2C20" stroke-width="3"/>
    <rect x="716" y="252" width="64" height="140" rx="24" fill="#33241A" stroke="#3B2C20" stroke-width="3"/>
    <rect x="222" y="300" width="516" height="64" rx="16" fill="#33241A" stroke="#3B2C20" stroke-width="3"/>
    <rect x="222" y="380" width="516" height="14" rx="7" fill="#241A12"/>
    <rect x="236" y="384" width="12" height="26" rx="4" fill="#241A12"/>
    <rect x="712" y="384" width="12" height="26" rx="4" fill="#241A12"/>
    <!-- throw pillow -->
    <rect x="702" y="238" width="54" height="54" rx="12" fill="#8C5A32" transform="rotate(-8 729 265)"/>
  </g>

  <!-- person -->
  <g>
    <!-- legs -->
    <rect x="340" y="316" width="20" height="86" rx="10" fill="#3B2C20"/>
    <rect x="404" y="316" width="20" height="86" rx="10" fill="#3B2C20"/>
    <ellipse cx="345" cy="406" rx="22" ry="9" fill="#241A12"/>
    <g class="toe"><ellipse cx="412" cy="406" rx="22" ry="9" fill="#241A12"/></g>
    <!-- torso -->
    <path d="M338 322 q-8 -76 16 -104 q22 -22 56 -8 q20 10 22 44 l6 68 Z" fill="#4E3624"/>
    <!-- head -->
    <g class="nod">
      <circle cx="386" cy="180" r="27" fill="#C9A177"/>
      <path d="M359 172 q6 -24 30 -22 q22 2 24 22 q-14 -12 -28 -10 q-16 2 -26 10 Z" fill="#241A12"/>
    </g>
  </g>

  <!-- guitar -->
  <g>
    <!-- neck toward the armrest -->
    <rect x="232" y="234" width="180" height="12" rx="5" fill="#5A3A22" transform="rotate(9 232 234)"/>
    <rect x="216" y="226" width="26" height="20" rx="4" fill="#241A12" transform="rotate(9 216 226)"/>
    <!-- body -->
    <g transform="rotate(9 452 280)">
      <path d="M452 240 q30 -6 44 12 q12 16 4 32 q-8 18 -28 22 q-34 7 -54 -6 q-18 -12 -14 -32 q4 -18 22 -24 q14 -5 26 -4 Z" fill="#A96F3F" stroke="#7A4E28" stroke-width="3"/>
      <circle cx="446" cy="278" r="15" fill="#241A12"/>
      <rect x="470" y="270" width="22" height="8" rx="3" fill="#4E3624"/>
    </g>
    <!-- strings -->
    <path d="M236 240 L470 272" stroke="#E8D9B4" stroke-width="1.4" opacity="0.85"/>
    <path d="M236 246 L470 278" stroke="#E8D9B4" stroke-width="1.1" opacity="0.7"/>
    <!-- fretting hand -->
    <circle cx="282" cy="248" r="10" fill="#C9A177"/>
    <!-- strumming arm -->
    <g class="strum">
      <path d="M420 236 q28 4 34 34" stroke="#4E3624" stroke-width="16" fill="none" stroke-linecap="round"/>
      <circle cx="456" cy="273" r="10" fill="#C9A177"/>
    </g>
  </g>

  <!-- drifting notes -->
  <g>
    <g class="note"><ellipse cx="500" cy="222" rx="6.5" ry="5" transform="rotate(-18 500 222)"/><rect x="504.5" y="196" width="2.6" height="26" rx="1.3"/><path d="M507 196 q10 3 8 13 q-2 -6 -8 -7 Z"/></g>
    <g class="note n2"><ellipse cx="524" cy="238" rx="6.5" ry="5" transform="rotate(-18 524 238)"/><rect x="528.5" y="212" width="2.6" height="26" rx="1.3"/><path d="M531 212 q10 3 8 13 q-2 -6 -8 -7 Z"/></g>
    <g class="note n3"><ellipse cx="486" cy="244" rx="6.5" ry="5" transform="rotate(-18 486 244)"/><rect x="490.5" y="218" width="2.6" height="26" rx="1.3"/><path d="M493 218 q10 3 8 13 q-2 -6 -8 -7 Z"/></g>
  </g>

  <!-- cat, a calico napping on the other cushion -->
  <g>
    <clipPath id="cat-body"><ellipse cx="636" cy="306" rx="52" ry="27"/></clipPath>
    <g class="tail">
      <path d="M688 322 q34 -4 30 -26 q-2 -12 -16 -12" stroke="#C98A4B" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M712 292 q6 -6 2 -12" stroke="#241A12" stroke-width="10" fill="none" stroke-linecap="round"/>
    </g>
    <g class="breathe">
      <ellipse cx="636" cy="306" rx="52" ry="27" fill="#E8D9B4"/>
      <g clip-path="url(#cat-body)">
        <ellipse cx="664" cy="292" rx="26" ry="18" fill="#C98A4B"/>
        <ellipse cx="628" cy="286" rx="16" ry="12" fill="#241A12"/>
        <ellipse cx="650" cy="322" rx="14" ry="10" fill="#241A12"/>
        <ellipse cx="606" cy="316" rx="13" ry="10" fill="#C98A4B"/>
      </g>
    </g>
    <!-- head resting on paws -->
    <circle cx="590" cy="308" r="19" fill="#E8D9B4"/>
    <path d="M590 289 a19 19 0 0 0 -13 33 q-2 -20 13 -33 Z" fill="#C98A4B"/>
    <path d="M577 295 l-3 -12 l11 6 Z" fill="#C98A4B"/>
    <path d="M598 293 l5 -11 l-12 4 Z" fill="#241A12"/>
    <path d="M604 296 q8 6 5 16 q-8 2 -12 -2 q8 -6 7 -14 Z" fill="#241A12"/>
    <path d="M580 309 q4 3 8 0 M590 309 q4 3 8 0" stroke="#241A12" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="583" cy="326" rx="10" ry="5" fill="#DCCDB4"/>
    <ellipse cx="601" cy="327" rx="10" ry="5" fill="#DCCDB4"/>
  </g>
</svg>
