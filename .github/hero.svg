<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Someone on a couch playing a classical guitar, a warm coffee on the side table, a calico cat napping on the other cushion">
  <style>
    .steam { stroke: #A6907B; stroke-width: 3; stroke-linecap: round; fill: none; opacity: 0; animation: steam 3.2s ease-in-out infinite; }
    .steam.s2 { animation-delay: 1.1s; }
    .steam.s3 { animation-delay: 2.2s; }
    @keyframes steam {
      0%   { opacity: 0; transform: translateY(6px); }
      25%  { opacity: 0.55; }
      70%  { opacity: 0.15; }
      100% { opacity: 0; transform: translateY(-26px); }
    }

    .strum { transform-box: fill-box; transform-origin: 80% 8%; animation: strum 0.62s ease-in-out infinite alternate; }
    @keyframes strum {
      from { transform: rotate(-4deg); }
      to   { transform: rotate(5deg); }
    }

    .nod { transform-box: fill-box; transform-origin: 50% 92%; animation: nod 2.48s ease-in-out infinite; }
    @keyframes nod {
      0%, 100% { transform: rotate(-1.4deg); }
      50%      { transform: rotate(1.6deg); }
    }

    .toe { transform-box: fill-box; transform-origin: 15% 85%; animation: toe 1.24s ease-in-out infinite alternate; }
    @keyframes toe {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-8deg); }
    }

    .breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.8s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { transform: scale(1, 1); }
      45%      { transform: scale(1.015, 1.05); }
    }

    .tail { transform-box: fill-box; transform-origin: 8% 30%; animation: tail 6.5s ease-in-out infinite; }
    @keyframes tail {
      0%, 78%, 100% { transform: rotate(0deg); }
      84%           { transform: rotate(9deg); }
      90%           { transform: rotate(-4deg); }
    }

    .note { fill: #E0A458; opacity: 0; animation: drift 4.2s ease-out infinite; }
    .note.n2 { animation-delay: 1.4s; }
    .note.n3 { animation-delay: 2.8s; }
    @keyframes drift {
      0%   { opacity: 0; transform: translate(0, 0) rotate(0deg); }
      12%  { opacity: 0.85; }
      70%  { opacity: 0.25; }
      100% { opacity: 0; transform: translate(30px, -84px) rotate(12deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .steam, .strum, .nod, .toe, .breathe, .tail, .note { animation: none; }
      .steam { opacity: 0.35; }
      .note { opacity: 0.5; }
    }
  </style>

  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#2E211735"/>
      <stop offset="0.55" stop-color="#2A1E1622"/>
      <stop offset="1" stop-color="#1D141000"/>
    </radialGradient>
    <linearGradient id="top-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CDA268"/>
      <stop offset="1" stop-color="#B98A52"/>
    </linearGradient>
  </defs>

  <!-- room -->
  <rect width="960" height="480" fill="#1D1410"/>
  <rect width="960" height="480" fill="url(#glow)"/>
  <rect y="404" width="960" height="76" fill="#17100C"/>
  <ellipse cx="480" cy="432" rx="330" ry="20" fill="#241A12"/>
  <ellipse cx="480" cy="432" rx="268" ry="14" fill="none" stroke="#2E2117" stroke-width="3"/>

  <!-- side table with coffee -->
  <g>
    <rect x="104" y="326" width="10" height="84" rx="3" fill="#4E3624"/>
    <ellipse cx="109" cy="410" rx="26" ry="5" fill="#241A12"/>
    <ellipse cx="109" cy="322" rx="56" ry="10" fill="#5A3A22"/>
    <ellipse cx="109" cy="318" rx="56" ry="10" fill="#6B4529"/>
    <!-- saucer and mug -->
    <ellipse cx="100" cy="312" rx="28" ry="5" fill="#8C5A32"/>
    <path d="M80 280 q0 -4 4 -4 h32 q4 0 4 4 l-3 28 q-1 4 -5 4 h-24 q-4 0 -5 -4 Z" fill="#E0A458"/>
    <ellipse cx="100" cy="279" rx="19" ry="4.5" fill="#3B2214"/>
    <path d="M120 284 q17 4 0 19" stroke="#E0A458" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <!-- steam -->
    <path class="steam" d="M90 266 q-5 -9 1 -17 q5 -7 0 -14"/>
    <path class="steam s2" d="M101 264 q6 -9 0 -17 q-5 -8 1 -15"/>
    <path class="steam s3" d="M111 266 q-4 -8 1 -15 q5 -8 0 -15"/>
  </g>

  <!-- couch -->
  <g>
    <rect x="212" y="188" width="548" height="150" rx="24" fill="#31231A" stroke="#3F2E20" stroke-width="3"/>
    <path d="M486 200 v128" stroke="#241A12" stroke-width="3" opacity="0.6"/>
    <rect x="186" y="248" width="66" height="148" rx="26" fill="#3A2A1D" stroke="#463322" stroke-width="3"/>
    <rect x="708" y="248" width="66" height="148" rx="26" fill="#3A2A1D" stroke="#463322" stroke-width="3"/>
    <!-- seat cushions -->
    <rect x="234" y="302" width="246" height="66" rx="16" fill="#3D2B1D" stroke="#4A3624" stroke-width="3"/>
    <rect x="486" y="302" width="240" height="66" rx="16" fill="#3D2B1D" stroke="#4A3624" stroke-width="3"/>
    <rect x="234" y="376" width="492" height="16" rx="8" fill="#241A12"/>
    <rect x="248" y="390" width="14" height="22" rx="5" fill="#241A12"/>
    <rect x="700" y="390" width="14" height="22" rx="5" fill="#241A12"/>
    <!-- throw pillow -->
    <rect x="694" y="234" width="56" height="56" rx="14" fill="#8C5A32" transform="rotate(-9 722 262)"/>
    <path d="M700 248 q22 -10 44 0" stroke="#7A4E28" stroke-width="3" fill="none" transform="rotate(-9 722 262)"/>
  </g>

  <!-- person, seated -->
  <g>
    <!-- torso -->
    <path d="M350 330 L 347 252 Q 347 210 378 203 Q 395 199 412 205 Q 440 214 440 252 L 438 330 Z" fill="#6B5138"/>
    <path d="M377 206 q17 -6 34 0 l-6 12 q-11 -5 -22 0 Z" fill="#5A4430"/>
    <!-- head -->
    <g class="nod">
      <circle cx="394" cy="180" r="23" fill="#C9A177"/>
      <path d="M371 180 a23 23 0 0 1 46 0 Z" fill="#241A12"/>
      <rect x="370.5" y="176" width="5" height="12" rx="2.5" fill="#241A12"/>
      <rect x="412.5" y="176" width="5" height="12" rx="2.5" fill="#241A12"/>
      <path d="M416 184 q4 1 3 6" stroke="#B58D62" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- lap: one connected piece over the cushion edge -->
    <path d="M350 330 q-14 -14 -8 -14 h104 q8 0 8 13 v10 q0 13 -13 13 h-78 q-13 0 -13 -13 Z" fill="#46362A"/>
    <ellipse cx="352" cy="340" rx="16" ry="14" fill="#46362A"/>
    <ellipse cx="446" cy="340" rx="16" ry="14" fill="#46362A"/>
    <!-- calves in front of the couch base -->
    <rect x="338" y="342" width="21" height="64" rx="10" fill="#3E3023" transform="rotate(4 348 374)"/>
    <rect x="436" y="342" width="21" height="64" rx="10" fill="#3E3023" transform="rotate(-4 446 374)"/>
    <!-- shoes -->
    <path d="M328 402 q1 -7 9 -7 h14 q8 0 9 7 l1 5 h-34 Z" fill="#17100C"/>
    <rect x="328" y="406" width="35" height="4" rx="2" fill="#55402A"/>
    <g class="toe">
      <path d="M436 402 q1 -7 9 -7 h14 q8 0 9 7 l1 5 h-34 Z" fill="#17100C"/>
      <rect x="436" y="406" width="35" height="4" rx="2" fill="#55402A"/>
    </g>
  </g>

  <!-- classical guitar -->
  <g>
    <g transform="translate(468 296) rotate(-70)">
      <!-- body: waisted figure eight, spruce top over darker side -->
      <path d="M0 -62 C 26 -62 40 -52 40 -34 C 40 -20 32 -12 32 0 C 32 14 46 20 46 38 C 46 64 24 72 0 72 C -24 72 -46 64 -46 38 C -46 20 -32 14 -32 0 C -32 -12 -40 -20 -40 -34 C -40 -52 -26 -62 0 -62 Z"
            fill="#7A4E28"/>
      <path d="M0 -58 C 23 -58 36 -49 36 -32 C 36 -19 29 -11 29 0 C 29 13 42 19 42 36 C 42 60 22 68 0 68 C -22 68 -42 60 -42 36 C -42 19 -29 13 -29 0 C -29 -11 -36 -19 -36 -32 C -36 -49 -23 -58 0 -58 Z"
            fill="url(#top-wood)"/>
      <!-- rosette and soundhole -->
      <circle cx="0" cy="-4" r="17" fill="none" stroke="#7A4E28" stroke-width="4"/>
      <circle cx="0" cy="-4" r="13" fill="#241A12"/>
      <!-- bridge with tie block -->
      <rect x="-19" y="34" width="38" height="9" rx="2.5" fill="#3B2C20"/>
      <rect x="-13" y="36" width="26" height="5" rx="2" fill="#241A12"/>
      <!-- neck and fingerboard -->
      <rect x="-8" y="-196" width="16" height="140" rx="2" fill="#7A4E28"/>
      <rect x="-7" y="-196" width="14" height="142" fill="#241A12"/>
      <!-- frets -->
      <path d="M-7 -74 h14 M-7 -92 h14 M-7 -110 h14 M-7 -128 h14 M-7 -146 h14 M-7 -164 h14 M-7 -182 h14" stroke="#8C744E" stroke-width="1.6"/>
      <!-- nut -->
      <rect x="-8" y="-198" width="16" height="4" fill="#EBDCC0"/>
      <!-- slotted headstock -->
      <path d="M-9 -198 L -11 -238 Q -11 -244 -5 -244 L 5 -244 Q 11 -244 11 -238 L 9 -198 Z" fill="#8C5A32"/>
      <rect x="-6" y="-236" width="4.5" height="32" rx="2.2" fill="#241A12"/>
      <rect x="1.5" y="-236" width="4.5" height="32" rx="2.2" fill="#241A12"/>
      <!-- tuning pegs -->
      <circle cx="-13" cy="-228" r="3" fill="#DCCDB4"/>
      <circle cx="-13" cy="-214" r="3" fill="#DCCDB4"/>
      <circle cx="13" cy="-228" r="3" fill="#DCCDB4"/>
      <circle cx="13" cy="-214" r="3" fill="#DCCDB4"/>
      <!-- strings -->
      <path d="M-4.5 36 L -4.5 -198 M0 36 L 0 -198 M4.5 36 L 4.5 -198" stroke="#EFE3C8" stroke-width="1.1" opacity="0.9"/>
      <path d="M-2.2 36 L -2.2 -198 M2.2 36 L 2.2 -198" stroke="#EFE3C8" stroke-width="0.8" opacity="0.6"/>
    </g>
    <!-- fretting hand on the neck -->
    <circle cx="329" cy="243" r="10" fill="#C9A177"/>
    <path d="M323 236 q-6 -4 -4 -10" stroke="#C9A177" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- strumming arm -->
    <g class="strum">
      <path d="M436 232 q36 8 32 52" stroke="#6B5138" stroke-width="17" fill="none" stroke-linecap="round"/>
      <circle cx="466" cy="288" r="10" fill="#C9A177"/>
      <path d="M470 296 q6 4 4 10" stroke="#C9A177" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- drifting notes -->
  <g>
    <g class="note"><ellipse cx="502" cy="222" rx="6.5" ry="5" transform="rotate(-18 502 222)"/><rect x="506.5" y="196" width="2.6" height="26" rx="1.3"/><path d="M509 196 q10 3 8 13 q-2 -6 -8 -7 Z"/></g>
    <g class="note n2"><ellipse cx="528" cy="240" rx="6.5" ry="5" transform="rotate(-18 528 240)"/><rect x="532.5" y="214" width="2.6" height="26" rx="1.3"/><path d="M535 214 q10 3 8 13 q-2 -6 -8 -7 Z"/></g>
    <g class="note n3"><ellipse cx="490" cy="246" rx="6.5" ry="5" transform="rotate(-18 490 246)"/><rect x="494.5" y="220" width="2.6" height="26" rx="1.3"/><path d="M497 220 q10 3 8 13 q-2 -6 -8 -7 Z"/></g>
  </g>

  <!-- cat, a calico napping on the other cushion -->
  <g>
    <clipPath id="cat-body"><ellipse cx="636" cy="306" rx="52" ry="27"/></clipPath>
    <ellipse cx="628" cy="330" rx="66" ry="9" fill="#2E2117"/>
    <g class="tail">
      <path d="M688 322 q34 -4 30 -26 q-2 -12 -16 -12" stroke="#C98A4B" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M712 292 q6 -6 2 -12" stroke="#241A12" stroke-width="10" fill="none" stroke-linecap="round"/>
    </g>
    <g class="breathe">
      <ellipse cx="636" cy="306" rx="52" ry="27" fill="#E8D9B4"/>
      <g clip-path="url(#cat-body)">
        <ellipse cx="664" cy="292" rx="26" ry="18" fill="#C98A4B"/>
        <ellipse cx="628" cy="286" rx="16" ry="12" fill="#241A12"/>
        <ellipse cx="650" cy="322" rx="14" ry="10" fill="#241A12"/>
        <ellipse cx="606" cy="316" rx="13" ry="10" fill="#C98A4B"/>
      </g>
    </g>
    <!-- head resting on paws -->
    <circle cx="590" cy="308" r="19" fill="#E8D9B4"/>
    <path d="M590 289 a19 19 0 0 0 -13 33 q-2 -20 13 -33 Z" fill="#C98A4B"/>
    <path d="M577 295 l-3 -12 l11 6 Z" fill="#C98A4B"/>
    <path d="M598 293 l5 -11 l-12 4 Z" fill="#241A12"/>
    <path d="M604 296 q8 6 5 16 q-8 2 -12 -2 q8 -6 7 -14 Z" fill="#241A12"/>
    <path d="M580 309 q4 3 8 0 M590 309 q4 3 8 0" stroke="#241A12" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M586 315 l2 2 l2 -2" stroke="#B77A3F" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <ellipse cx="583" cy="326" rx="10" ry="5" fill="#DCCDB4"/>
    <ellipse cx="601" cy="327" rx="10" ry="5" fill="#DCCDB4"/>
  </g>
</svg>
